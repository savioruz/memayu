[package]
name = "memayu-mcp"
version.workspace = true
edition.workspace = true
description = "MCP stdio server subcommand for memayu — local and cloud backends"

[dependencies]
memayu-core = { path = "../memayu-core" }
async-trait = "0.1"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "rt"] }
