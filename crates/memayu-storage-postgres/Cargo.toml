[package]
name = "memayu-storage-postgres"
version.workspace = true
edition.workspace = true
description = "Memayu StorageProvider implementation on Postgres + pgvector"

[dependencies]
memayu-core = { path = "../memayu-core" }
memayu-config = { path = "../memayu-config" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "macros", "migrate", "uuid"] }
pgvector = { version = "0.4", features = ["sqlx"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
async-trait = "0.1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[features]
default = []
# Integration tests that need a live Postgres+pgvector (ARCHITECTURE.md §7).
integration = []
