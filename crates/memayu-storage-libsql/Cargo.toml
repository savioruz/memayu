[package]
name = "memayu-storage-libsql"
version.workspace = true
edition.workspace = true
description = "Memayu StorageProvider implementation on embedded libSQL with native vector search"

[dependencies]
memayu-core = { path = "../memayu-core" }
memayu-config = { path = "../memayu-config" }
libsql = { version = "0.9", features = ["replication"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
